# Dev Profile - PostgreSQL Configuration
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5431}/${DB_NAME:myDomainDatabase}?ssl=false
spring.datasource.username=${DB_USER:plohiya}
spring.datasource.password=${DB_PASSWORD:Badu@2002}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Development Environment Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Development Specific Settings
event.venue.max-capacity=500
tournament.fixture.max-concurrent-matches=5

# Logging for Development
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE