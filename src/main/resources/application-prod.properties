# Production Profile - Database Configuration from Environment Variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/${DB_NAME:myDomainDatabase}
spring.datasource.username=${DB_USER:plohiya}
spring.datasource.password=${DB_PASSWORD:Badu@2002}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Production Environment Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Production Specific Settings
event.venue.max-capacity=1000
tournament.fixture.max-concurrent-matches=10

# Cache Configuration
spring.cache.type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Security Settings
spring.security.user.password=${ADMIN_PASSWORD:${DB_PASSWORD}}

# Logging Configuration
logging.level.root=WARN
logging.level.com.sportevent=INFO