# Common Application Properties
spring.application.name=sport-event-manager
server.port=8080

# JPA Common Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Logging Configuration
logging.level.root=INFO
logging.level.com.sportevent=DEBUG

# Event Management Configuration
event.registration.max-team-size=15
event.registration.min-team-size=5
event.venue.auto-assign=true

# Tournament Configuration
tournament.fixture.auto-generate=true
tournament.match.default-duration-minutes=180

# Security Configuration
spring.security.user.name=admin
spring.security.user.password={noop}admin123

# Active Profile (default to local)
spring.profiles.active=dev