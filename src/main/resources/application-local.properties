# Local Profile - H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:sportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Local Environment Specific Settings
event.venue.max-capacity=100
tournament.fixture.max-concurrent-matches=2